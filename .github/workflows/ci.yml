name: CI & Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Markdown & Curator Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Curator Script & Category Links
        run: |
          python -m py_compile .github/scripts/curator.py
          python -c "
          import os
          text = open('README.md', encoding='utf-8').read()
          assert 'Agentic & Context Engineering' in text
          for sub in ['infrastructure', 'devops', 'virtualization', 'bash-linux', 'windows', 'iac', 'programming']:
              p = os.path.join('tech', sub, 'README.md')
              assert os.path.exists(p), f'Missing {p}'
          print('All category README files and curator syntax verified.')
          "
